name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Use Node 24 for JavaScript-based actions (addresses Node 20 deprecation on runners)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate secrets
        run: |
          echo "🔍 Validating secrets..."
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ Error: EC2_SSH_KEY secret is not set or is empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ Error: EC2_HOST secret is not set or is empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ Error: EC2_USER secret is not set or is empty"
            exit 1
          fi
          echo "✅ All secrets are configured"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH connection successful!'"

      - name: Copy project files
        run: |
          rsync -avz --progress \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '.react-router' \
            --exclude '*.log' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/ec2_key.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/create-anything/

      - name: Install dependencies and restart app
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${EC2_USER}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            set -e
            # Must match rsync target (same user as EC2_USER secret — do not hardcode /home/ubuntu)
            cd ~/create-anything/apps/web
            
            # Ensure Node.js v20+ (Nodesource/apt — Ubuntu/Debian EC2)
            if command -v node >/dev/null 2>&1; then
              NODE_VERSION=$(node -v | cut -d'.' -f1 | tr -d 'v')
            else
              NODE_VERSION=0
            fi
            if [ "${NODE_VERSION:-0}" -lt 20 ]; then
              echo "📥 Installing Node.js v20 (Nodesource)..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            
            echo "Node version: $(node --version)"
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            # Restart the app with PM2
            echo "🔄 Restarting app..."
            pm2 restart ikemen || pm2 start 'npm run dev -- --port 4000 --host 0.0.0.0' --name ikemen
            pm2 save
            
            echo "✅ Deployment completed!"
          REMOTE_SCRIPT

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            echo "🔍 Verifying deployment..."
            pm2 status
            
            sleep 5
            
            # Test that the site is accessible
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ App is running (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  App returned HTTP $HTTP_STATUS"
            fi
            
            echo ""
            echo "✅ Deployment completed!"
            echo "🌐 Your app is live at https://ikemen-ranking.jp"
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
