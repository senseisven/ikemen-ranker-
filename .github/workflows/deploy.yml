name: Deploy to AWS EC2

on:
  workflow_dispatch: # Manual trigger only — click "Run workflow" in GitHub Actions tab

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Use Node 24 for JavaScript-based actions (addresses Node 20 deprecation on runners)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate secrets
        run: |
          echo "🔍 Validating secrets..."
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ Error: EC2_SSH_KEY secret is not set or is empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ Error: EC2_HOST secret is not set or is empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ Error: EC2_USER secret is not set or is empty"
            exit 1
          fi
          echo "✅ All secrets are configured"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Multiline PEM must stay quoted (do not use single quotes around the secret)
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/ec2_key.pem; then
            echo "::error::EC2_SSH_KEY secret must be a PEM private key (include -----BEGIN … KEY----- lines)."
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/ec2_key.pem -P '' >/dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not usable by OpenSSH (wrong format, passphrase-protected key, or copy/paste broke newlines)."
            exit 1
          fi
          echo "Key fingerprint (for comparison with AWS / your key pair):"
          ssh-keygen -lf ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          echo "Tip: set EC2_HOST to the instance Public IPv4 (digits only) to avoid DNS/IPv6 issues."
          echo "Preflight: can we open TCP to ${EC2_HOST}:22 from this runner?"
          if ! timeout 20 bash -c "echo >/dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
            echo "::error::Port 22 is not reachable (timeout/refused). Open inbound TCP 22 in the instance security group (e.g. 0.0.0.0/0 for testing). Use the instance's *public* IPv4 in EC2_HOST if it has no public DNS."
            exit 255
          fi
          echo "TCP 22 reachable."
          # -4: force IPv4 | IdentitiesOnly: do not try every key in ssh-agent (avoids flaky 255)
          SSH_BASE="-i $HOME/.ssh/ec2_key.pem -4 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o ConnectionAttempts=2"
          echo "Trying SSH as ${EC2_USER}@${EC2_HOST} (logging: ssh -v)…"
          set +e
          ssh $SSH_BASE -v "${EC2_USER}@${EC2_HOST}" "echo SSH_OK" 2>ssh-test.log
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo ""
            echo "---- Last lines from ssh -v (find Permission denied / Unable to negotiate / timed out) ----"
            tail -50 ssh-test.log
            echo "--------------------------------------------------------------------"
            if grep -qi "permission denied (publickey" ssh-test.log; then
              echo "::error::Auth failed (publickey). Fix one: (1) EC2_USER must match the AMI (ubuntu / ec2-user / …). (2) EC2_SSH_KEY must be the *private* .pem for the key pair shown on the EC2 instance in AWS (compare fingerprint above to EC2 → Key pair). (3) On the server: ~/.ssh/authorized_keys for that user must include the matching public key."
            elif grep -qi "connection timed out\|no route to host" ssh-test.log; then
              echo "::error::Timeout / no route. Security group, wrong IP, or instance stopped."
            else
              echo "::error::SSH failed (exit $code). See log above."
            fi
            exit 255
          fi
          echo "SSH connection successful."

      - name: Copy project files
        run: |
          rsync -avz --progress \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '.react-router' \
            --exclude '*.log' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/ec2_key.pem -4 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/create-anything/

      - name: Install dependencies and restart app
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem -4 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ${EC2_USER}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            set -e
            # Must match rsync target (same user as EC2_USER secret — do not hardcode /home/ubuntu)
            cd ~/create-anything/apps/web
            
            # Ensure Node.js v20+ (Nodesource/apt — Ubuntu/Debian EC2)
            if command -v node >/dev/null 2>&1; then
              NODE_VERSION=$(node -v | cut -d'.' -f1 | tr -d 'v')
            else
              NODE_VERSION=0
            fi
            if [ "${NODE_VERSION:-0}" -lt 20 ]; then
              echo "📥 Installing Node.js v20 (Nodesource)..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            
            echo "Node version: $(node --version)"
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            # Restart the app with PM2
            echo "🔄 Restarting app..."
            pm2 restart ikemen || pm2 start 'npm run dev -- --port 4000 --host 0.0.0.0' --name ikemen
            pm2 save
            
            echo "✅ Deployment completed!"
          REMOTE_SCRIPT

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/ec2_key.pem -4 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            echo "🔍 Verifying deployment..."
            pm2 status
            
            sleep 5
            
            # Test that the site is accessible
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ App is running (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  App returned HTTP $HTTP_STATUS"
            fi
            
            echo ""
            echo "✅ Deployment completed!"
            echo "🌐 Your app is live at https://ikemen-ranking.jp"
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
