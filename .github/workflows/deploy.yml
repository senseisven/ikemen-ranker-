name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          echo "🔍 Validating secrets..."
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ Error: EC2_SSH_KEY secret is not set or is empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ Error: EC2_HOST secret is not set or is empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ Error: EC2_USER secret is not set or is empty"
            exit 1
          fi
          echo "✅ All secrets are configured"
          echo "EC2_HOST: ${{ secrets.EC2_HOST }}"
          echo "EC2_USER: ${{ secrets.EC2_USER }}"
          echo "EC2_SSH_KEY length: $(echo -n '${{ secrets.EC2_SSH_KEY }}' | wc -c) characters"

      - name: Setup SSH
        run: |
          set -e
          
          # Create .ssh directory with explicit path
          SSH_DIR="$HOME/.ssh"
          mkdir -p "$SSH_DIR" || {
            echo "❌ Failed to create .ssh directory"
            exit 1
          }
          chmod 700 "$SSH_DIR"
          echo "✅ Created .ssh directory"
          
          # Write SSH key
          SSH_KEY_FILE="$SSH_DIR/ec2_key.pem"
          echo "${{ secrets.EC2_SSH_KEY }}" > "$SSH_KEY_FILE" || {
            echo "❌ Failed to write SSH key file"
            exit 1
          }
          chmod 600 "$SSH_KEY_FILE"
          
          # Verify key file
          if [ ! -f "$SSH_KEY_FILE" ]; then
            echo "❌ Error: SSH key file was not created"
            exit 1
          fi
          
          if [ ! -s "$SSH_KEY_FILE" ]; then
            echo "❌ Error: SSH key file is empty"
            exit 1
          fi
          
          # Basic validation - check for BEGIN marker
          if ! head -1 "$SSH_KEY_FILE" | grep -q "BEGIN"; then
            echo "⚠️  Warning: SSH key might be malformed (no BEGIN marker found)"
            echo "First line of key: $(head -1 "$SSH_KEY_FILE")"
          fi
          
          echo "✅ SSH key file created: $SSH_KEY_FILE"
          echo "Key file size: $(wc -c < "$SSH_KEY_FILE") bytes"
          
          # Add host to known_hosts
          KNOWN_HOSTS="$SSH_DIR/known_hosts"
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> "$KNOWN_HOSTS" 2>/dev/null || true
          chmod 600 "$KNOWN_HOSTS" 2>/dev/null || true
          
          echo "✅ SSH setup completed"

      - name: Show GitHub Actions IP
        run: |
          echo "🔍 GitHub Actions runner IP address:"
          GITHUB_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: ${GITHUB_IP}"
          echo ""
          echo "📋 Troubleshooting checklist:"
          echo "  ✓ Security group has SSH (22) rule with 0.0.0.0/0"
          echo "  ? Verify security group is attached to instance"
          echo "  ? Check VPC Network ACLs allow TCP port 22"
          echo "  ? Ensure instance is running and has public IP"
          echo ""
          echo "If connection still fails, check Network ACLs in VPC console"

      - name: Test SSH connection
        run: |
          echo "🔌 Attempting SSH connection..."
          echo "Connecting to: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          
          # Try with verbose output for debugging
          ssh -v -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o LogLevel=ERROR ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH connection successful!'" || {
            echo ""
            echo "❌ SSH connection failed!"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Verify the security group is attached to your instance:"
            echo "   - Go to EC2 → Instances → Select your instance → Security tab"
            echo "   - Ensure the security group with SSH rule (0.0.0.0/0) is listed"
            echo ""
            echo "2. Check Network ACLs (if using VPC):"
            echo "   - Go to VPC → Network ACLs"
            echo "   - Ensure inbound rule allows TCP port 22 from 0.0.0.0/0"
            echo ""
            echo "3. Verify instance is running:"
            echo "   - Check EC2 → Instances → Instance state should be 'running'"
            echo ""
            echo "4. Check if UFW firewall is blocking (we opened 443, but verify 22):"
            echo "   - SSH into instance and run: sudo ufw status"
            echo "   - Should show: 22/tcp ALLOW Anywhere"
            echo ""
            echo "5. Try connecting from your local machine to verify instance is reachable:"
            echo "   ssh -i ~/Downloads/ikemen-key.pem ubuntu@35.75.14.169"
            echo ""
            exit 1
          }

      - name: Create app directory
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /home/${{ secrets.EC2_USER }}/create-anything"

      - name: Copy project files
        run: |
          rsync -avz --progress \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.DS_Store' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '.react-router' \
            --exclude '*.log' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/create-anything/

      - name: Install dependencies and build static site
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${EC2_USER}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            set -e
            cd /home/ubuntu/create-anything
            
            # Check Node.js version and install v20+ if needed
            if ! command -v node &> /dev/null; then
              echo "📥 Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            else
              NODE_VERSION=$(node -v | cut -d'.' -f1 | tr -d 'v')
              if [ "$NODE_VERSION" -lt 20 ]; then
                echo "📥 Upgrading Node.js to v20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi
            fi
            
            echo "Node version: $(node --version)"
            echo "npm version: $(npm --version)"
            
            # Install root-level dependencies for static build
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            # Build static site (Vite SPA)
            echo "🏗️  Building static site..."
            npm run build:vite
            
            echo "✅ Build completed!"
            ls -la dist/
          REMOTE_SCRIPT

      - name: Deploy to nginx
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${EC2_USER}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            set -e
            
            # Clear old deployment and copy new files
            echo "🚀 Deploying to nginx..."
            sudo rm -rf /var/www/ikemen-compass/*
            sudo cp -r /home/ubuntu/create-anything/dist/* /var/www/ikemen-compass/
            
            # Copy public assets (favicon, etc.)
            sudo cp /home/ubuntu/create-anything/public/favicon.ico /var/www/ikemen-compass/ 2>/dev/null || true
            sudo cp /home/ubuntu/create-anything/public/placeholder.svg /var/www/ikemen-compass/ 2>/dev/null || true
            sudo cp /home/ubuntu/create-anything/public/robots.txt /var/www/ikemen-compass/ 2>/dev/null || true
            
            # Set correct ownership
            sudo chown -R www-data:www-data /var/www/ikemen-compass/
            
            echo "✅ Files deployed to /var/www/ikemen-compass/"
            ls -la /var/www/ikemen-compass/
          REMOTE_SCRIPT

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
            echo "🔍 Verifying deployment..."
            
            # Test that the site is accessible
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ikemen-ranking.jp/)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Site is accessible (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  Site returned HTTP $HTTP_STATUS"
            fi
            
            echo ""
            echo "✅ Deployment completed!"
            echo "🌐 Your app is live at https://ikemen-ranking.jp"
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
